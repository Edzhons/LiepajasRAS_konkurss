<!DOCTYPE html>
<html lang="lv">
<head>
  <meta charset="UTF-8">
  <title>Atkritumu Šķirošanas Spēle</title>
  <link rel="stylesheet" href="style.css">
  <script src="game.js" defer></script>
</head>
<body>
  <div id="layout-container">
    <!-- Left Section: Level Info -->
    <div id="level-panel">
      <div id="current-level"><h1>Līmenis: 1</h1></div>
      <img id="level-icon" src="" alt="Level Icon">
    </div>

    <div id="score-to-beat" class="side-box">
      <h2>Rezultāts, kas Tev jāpārspēj:</h2>
      <p id="best-player-score">Nav datu</p>
    </div>

    <!-- Center Section: Game Area -->
    <div id="game-container">
      <div id="game">
        <img id="bin" class="bin" src="" alt="Bin">
      </div>
    </div>

    <!-- Right Section: Score Info -->
    <div id="score-panel">
      <div id="score"><h1>Score: 0</h1></div>
      <div id="timer"><h2>Laiks: 20s</h2></div>
    </div>

    <div id="leaderboard" class="side-box">
      <h2>Top 5</h2>
      <ol id="leaderboard-list"></ol>
    </div>

  </div>

  <div id="game-over-screen">
    <div id="game-over-card">
      <h1>Rezultāti</h1>
      <p id="final-score"></p>
      <button onclick="location.href='index.html'" class="menu-btn">Sākumlapa</button>
      <button onclick="location.reload()" class="menu-btn">Mēģināt vēlreiz</button>
    </div>
  </div>

</body>
</html>
